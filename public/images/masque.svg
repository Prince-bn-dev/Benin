<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 280">
  <!-- Masque traditionnel (style Gelede) -->
  <defs>
    <linearGradient id="woodM" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B0793F"/>
      <stop offset="1" stop-color="#7A4A21"/>
    </linearGradient>
  </defs>
  <rect width="220" height="280" rx="14" fill="#0F1C14"/>
  <!-- coiffe -->
  <path d="M62 84 q48 -52 96 0 q10 12 4 26 H58 q-6 -14 4 -26Z" fill="#8C5A28"/>
  <path d="M84 62 q26 -22 52 0 q8 8 6 20 H78 q-2 -12 6 -20Z" fill="#FCD116"/>
  <!-- visage -->
  <path d="M66 108 h88 q6 34 -18 58 q-16 16 -26 16 t-26 -16 q-24 -24 -18 -58Z" fill="url(#woodM)"/>
  <!-- scarifications -->
  <g stroke="#5C3A17" stroke-width="3" stroke-linecap="round">
    <path d="M110 112 v14 M100 116 l20 0"/>
  </g>
  <!-- yeux -->
  <g fill="#FDFBF7">
    <ellipse cx="90" cy="142" rx="10" ry="7"/>
    <ellipse cx="130" cy="142" rx="10" ry="7"/>
  </g>
  <g fill="#0F1C14">
    <circle cx="90" cy="142" r="4"/>
    <circle cx="130" cy="142" r="4"/>
  </g>
  <!-- nez & bouche -->
  <path d="M110 150 q6 10 0 16" stroke="#5C3A17" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M96 180 q14 8 28 0" stroke="#5C3A17" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- collier -->
  <g>
    <path d="M70 196 q40 26 80 0 l6 14 q-46 28 -92 0Z" fill="#E8112D"/>
    <g fill="#FCD116">
      <circle cx="86" cy="206" r="4"/>
      <circle cx="110" cy="212" r="4"/>
      <circle cx="134" cy="206" r="4"/>
    </g>
  </g>
</svg>
