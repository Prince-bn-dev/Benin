<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 430">
  <defs>
    <linearGradient id="skinB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9c6c3e"/><stop offset="1" stop-color="#634022"/>
    </linearGradient>
    <linearGradient id="dressB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a5f1d"/><stop offset="1" stop-color="#5c3a10"/>
    </linearGradient>
  </defs>

  <!-- buste -->
  <path d="M60 430 C58 340 96 292 152 272 L196 272 C252 292 288 340 286 430 Z" fill="url(#dressB)"/>
  <path d="M96 430 C100 366 122 330 165 320 C208 330 230 366 234 430 Z" fill="#e3b505" opacity=".25"/>
  <path d="M112 430 C116 380 136 350 165 344 C194 350 214 380 218 430 Z" fill="none" stroke="#0d4a2c" stroke-width="3" opacity=".8"/>

  <!-- cou -->
  <path d="M136 220 L136 286 C148 296 182 296 194 286 L194 220 Z" fill="#583819"/>

  <!-- tête, profil regardant à droite -->
  <path d="M96 128
           C96 84 122 56 158 54
           C196 52 220 78 224 112
           L226 122
           C230 126 234 132 232 138
           C236 142 240 150 234 156
           C238 164 236 172 228 174
           C226 186 218 194 206 196
           C196 210 186 218 172 222
           L136 224
           C110 208 96 172 96 128 Z"
        fill="url(#skinB)"/>

  <!-- œil + sourcil + bouche -->
  <path d="M186 132 C192 126 202 126 208 132" stroke="#2c1c0e" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M182 116 C192 110 204 110 212 116" stroke="#2c1c0e" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M226 178 C222 180 218 180 214 178" stroke="#2c1c0e" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- oreille + boucles d'oreilles pendantes -->
  <path d="M120 150 C112 142 112 158 120 166 C126 172 130 164 126 156 Z" fill="#4a2d15"/>
  <circle cx="118" cy="182" r="8" fill="#e3b505"/>
  <path d="M118 190 C110 206 110 220 118 232 C126 220 126 206 118 190 Z" fill="#b31226"/>
  <circle cx="118" cy="236" r="6" fill="#e3b505"/>

  <!-- coiffe tressée avec nœud décoratif -->
  <path d="M92 120 C86 66 126 34 164 36 C204 38 226 66 226 100 C216 82 198 74 168 72 C136 70 108 88 92 120 Z" fill="#2c1c0e"/>
  <path d="M226 100 C226 116 220 124 212 128 C218 112 216 100 208 92 C218 92 224 96 226 100 Z" fill="#2c1c0e"/>
  <!-- rangs de tresses -->
  <g stroke="#e3b505" stroke-width="3" fill="none" opacity=".85">
    <path d="M98 106 C120 76 168 62 214 88"/>
    <path d="M96 118 C122 88 172 76 220 100"/>
  </g>
  <!-- fleur/coquillage sur la coiffe -->
  <g transform="translate(150 52)">
    <circle r="7" fill="#f7d774"/>
    <g fill="#fdfbf4">
      <circle cx="0" cy="-11" r="5"/><circle cx="10" cy="-6" r="5"/>
      <circle cx="10" cy="6" r="5"/><circle cx="0" cy="11" r="5"/>
      <circle cx="-10" cy="6" r="5"/><circle cx="-10" cy="-6" r="5"/>
    </g>
    <circle r="6" fill="#b31226"/>
  </g>

  <!-- scarifications et collier -->
  <g stroke="#3a2412" stroke-width="2.5" opacity=".7">
    <path d="M150 236 L150 250 M160 234 L160 252 M170 234 L170 250"/>
  </g>
  <g fill="none" stroke="#0d4a2c" stroke-width="4">
    <path d="M120 262 C146 276 184 276 210 262"/>
  </g>
  <g fill="#f7d774">
    <circle cx="126" cy="266" r="4"/><circle cx="146" cy="272" r="4"/>
    <circle cx="165" cy="274" r="4"/><circle cx="184" cy="272" r="4"/>
    <circle cx="204" cy="266" r="4"/>
  </g>
</svg>
